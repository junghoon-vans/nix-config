version: 2
updates:
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: daily
      time: "02:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    groups:
      flake-inputs:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "02:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
