version: 2
updates:
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: daily
      time: "02:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    cooldown:
      exclude:
        - hermes-omp-acp
    ignore:
      # Hermes uses a dedicated updater; legacy date tags sort above semver releases.
      - dependency-name: hermes-agent
      # Tap revisions need declared-package/recipe relevance checks in the Homebrew updater.
      - dependency-name: homebrew-core
      - dependency-name: homebrew-cask
      - dependency-name: hashicorp-tap
    groups:
      flake-inputs:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "02:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
