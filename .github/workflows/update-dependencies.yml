name: update dependencies

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  homebrew:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Create repository-scoped update token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPENDENCY_UPDATES_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATES_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Test Homebrew package summaries
        run: python3 -B -m unittest discover -s scripts/updates -p 'test_update_homebrew.py'
      - name: Update Homebrew tap pins and summarize packages
        run: python3 -B scripts/updates/update-homebrew.py --body-file "$RUNNER_TEMP/homebrew-update.md"
      - name: Open Homebrew lock update pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          scripts/updates/open-update-pr.sh \
            automation/update-homebrew \
            "chore(deps): update Homebrew tap pins" \
            "$(cat "$RUNNER_TEMP/homebrew-update.md")" \
            flake.lock

  fixed-releases:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package: [apm, bun, gnomcp, omp, paseo]
    steps:
      - name: Create repository-scoped update token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPENDENCY_UPDATES_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATES_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - id: update
        name: Resolve latest release and hash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 scripts/updates/update-fixed-release.py '${{ matrix.package }}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Open focused update pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          scripts/updates/open-update-pr.sh \
            "automation/update-${{ matrix.package }}" \
            "chore(deps): update ${{ matrix.package }} to ${{ steps.update.outputs.version }}" \
            "Automated fixed-release update. Release-pin-only validation checks manifest structure and SHA-256 hash syntax; full host builds are skipped. Activation remains manual." \
            release-pins.json

  gno:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Create repository-scoped update token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPENDENCY_UPDATES_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATES_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Test Gno release updates
        run: python3 -B -m unittest discover -s scripts/updates -p 'test_update_gno.py'
      - id: update
        name: Resolve latest stable Gno releases, hash, build, and smoke
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -B scripts/updates/update-gno.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Open Gno toolchain update pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          scripts/updates/open-update-pr.sh \
            automation/update-gno \
            "chore(deps): update $VERSION" \
            "Automated latest stable GitHub release update for Gno and gnopls. Pins release commits and recalculates source and Go dependency hashes. Builds and smoke-checks gno, gnokey, and gnopls against the shared GNOROOT before opening this PR. Normal PR validation evaluates and builds both Darwin hosts. Review and activation remain manual." \
            modules/languages/gno.nix

  hermes:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Create repository-scoped update token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPENDENCY_UPDATES_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATES_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - id: update
        name: Resolve latest stable Hermes release and lock its input
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -B scripts/updates/update-hermes.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Open Hermes update pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          scripts/updates/open-update-pr.sh \
            automation/update-hermes \
            "chore(deps): update Hermes to ${{ steps.update.outputs.version }}" \
            "Automated stable Hermes release update. Updates the tagged flake input and its lockfile graph; package version metadata follows the locked release tag automatically. Normal PR validation builds both Darwin hosts and verifies OMP tool exposure in the packaged Hermes runtime. Review and activation remain manual." \
            flake.nix \
            flake.lock

  tagged-skills:
    runs-on: macos-15
    steps:
      - name: Create repository-scoped update token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPENDENCY_UPDATES_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATES_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install manifest parser
        run: python -m pip install --disable-pip-version-check -r scripts/security/requirements.txt
      - name: Update tagged APM skills
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          apm_store="$(nix build --no-link --print-out-paths .#apm)"
          python3 scripts/updates/update-tagged-skills.py --apm "$apm_store/bin/apm"
          make skills
      - name: Open skill update pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          scripts/updates/open-update-pr.sh \
            automation/update-apm-skills \
            "chore(deps): update tagged APM skills" \
            "Automated update of APM dependencies whose upstream repositories publish stable tags. Commit-only dependencies remain pinned for manual review." \
            apm.yml \
            apm.lock.yaml \
            docs/skills.md

  npm-mcps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create repository-scoped update token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPENDENCY_UPDATES_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATES_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test MCP version updates
        run: python -B -m unittest discover -s scripts/updates -p 'test_update_mcp_versions.py'
      - name: Resolve newer stable npm MCP versions
        run: python -B scripts/updates/update-mcp-versions.py
      - name: Open MCP version update pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          scripts/updates/open-update-pr.sh \
            automation/update-npm-mcps \
            "chore(deps): update npm MCP server versions" \
            "Automated exact-version npm MCP update from the registry latest tags. Prerelease pins, disabled servers, remote services, and unsupported launch commands remain unchanged. MCP inspection runs on the changed configuration; findings are advisory. Review and activation remain manual." \
            home/.omp/agent/mcp.json
