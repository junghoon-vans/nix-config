name: validate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      configuration_changed: ${{ steps.detect.outputs.configuration_changed }}
      skill_dependencies_changed: ${{ steps.skills.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate CI scripts and release pins
        run: |
          bash -n .github/scripts/* scripts/validation/check.sh scripts/security/*.sh
          python3 -B scripts/validation/check-release-pins.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install lockfile parser
        run: python -m pip install --disable-pip-version-check -r scripts/security/requirements.txt
      - name: Check generated skill inventory
        run: make skills-check
      - name: Test skill inspection contract
        run: python -B -m unittest discover -s scripts/security -p 'test_*.py'
      - id: skills
        name: Validate pinned skill inputs
        run: >-
          python scripts/security/scan-skills.py
          --base-ref "$(git rev-parse --verify HEAD^1)"
          --output-dir "$RUNNER_TEMP/skill-input-validation"
          --plan-only
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/detect-nix-config-changes "$BASE_SHA" "$HEAD_SHA"

  security:
    name: SkillSpector advisory
    needs: changes
    if: needs.changes.outputs.skill_dependencies_changed == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install lockfile parser
        run: python -m pip install --disable-pip-version-check -r scripts/security/requirements.txt
      - name: Install pinned SkillSpector
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          'skillspector @ git+https://github.com/NVIDIA/SkillSpector.git@69d7d059da38160296b2311320ed4c72a9c3fdb6'
      - name: Inspect changed pinned skills (advisory only)
        env:
          # Reserve one minute of the wrapper's 60-minute limit for reporting.
          SKILLSPECTOR_MAX_WORKFLOW_SECONDS: ${{ vars.SKILLSPECTOR_MAX_WORKFLOW_SECONDS || '3540' }}
          SKILLSPECTOR_MAX_STATIC_ANALYSIS_SECONDS_PER_ARTIFACT: ${{ vars.SKILLSPECTOR_MAX_STATIC_ANALYSIS_SECONDS_PER_ARTIFACT || '3540' }}
        run: >-
          python scripts/security/scan-skills.py
          --base-ref "$(git rev-parse --verify HEAD^1)"
          --output-dir "$RUNNER_TEMP/skillspector-reports"
      - name: Report inspection infrastructure failure
        if: failure()
        run: |
          printf '%s\n' '## SkillSpector advisory' \
            'Inspection did not finish successfully. Review the job logs and any report artifacts; no safety conclusion is available.' \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: skillspector-reports
          path: ${{ runner.temp }}/skillspector-reports/
          if-no-files-found: ignore
          retention-days: 30

  security-comment:
    name: Publish SkillSpector advisory
    needs: [changes, security]
    if: >-
      always() && !cancelled() &&
      needs.changes.outputs.skill_dependencies_changed == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish or update advisory comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/security/comment-skills.sh

  checks:
    needs: changes
    if: needs.changes.outputs.configuration_changed == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Run repository checks
        run: make check

  evaluate:
    needs: [changes, checks]
    if: needs.changes.outputs.configuration_changed == 'true'
    runs-on: macos-15
    strategy:
      matrix:
        host: [junghoonui-MacBookAir, junghoonui-MacBookPro]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Evaluate Darwin configuration
        run: nix eval .#darwinConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath
      - name: Build Darwin configuration
        run: nix build .#darwinConfigurations.${{ matrix.host }}.system
      - name: Verify packaged Hermes version and OMP tool exposure
        run: nix build .#darwinConfigurations.${{ matrix.host }}.config.system.build.hermesRuntimeCheck --no-link

  validate:
    if: always()
    needs: [changes, checks, evaluate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require successful configuration validation
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CONFIGURATION_CHANGED: ${{ needs.changes.outputs.configuration_changed }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          EVALUATE_RESULT: ${{ needs.evaluate.result }}
        run: .github/scripts/require-nix-validation
